name: Feature
description: Something Pigeon should do.
labels: [feature, triage]
body:
  - type: markdown
    attributes:
      value: Short and factual. Bullets beat paragraphs.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem, or who it's for. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What it would do. Leave the how for the pull request.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Not sure, core, lighthouse, web]
      default: 0
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check someone else could run to say it's finished.
    validations:
      required: true
