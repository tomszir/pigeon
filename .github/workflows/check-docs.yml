name: check-docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    # A release PR only bumps the version; there's nothing to document.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-docs --base "origin/${{ github.base_ref }}"
