name: check-docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    # A release PR only bumps the version; there's nothing to document.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-docs --base "origin/${{ github.base_ref }}"
