name: release-please

# Keeps a release PR open that bumps the version from the Conventional Commits on main. Merging
# it tags the release and points the `release` branch at it, which Cloudflare deploys
# Releasing stays the maintainer's call: it's a merge. On the release PR it drafts
# Changelog.txt's notes for the maintainer to rewrite before merging.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A personal access token, as a repository secret, lets pushes to the release PR run CI;
      # GITHUB_TOKEN alone can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Where the release PR stood before release-please rebuilds its branch, so the notes
      # written there carry over. The branch is release-please--branches--main, plus
      # --components--<name> when the package has one (ours is pigeon), so match both.
      - id: before
        run: |
          head=$(git for-each-ref --count=1 --format='%(objectname)' \
            refs/remotes/origin/release-please--branches--main \
            'refs/remotes/origin/release-please--branches--main--*')
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal access token, as a repository secret, lets CI run on the release PR;
          # GITHUB_TOKEN alone can't.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Workers Builds deploys a branch, not a tag: move `release` to the commit just released.
      - if: ${{ steps.release.outputs.release_created }}
        run: git push --force origin "${{ steps.release.outputs.sha }}:refs/heads/release"
      - if: ${{ steps.release.outputs.pr }}
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - if: ${{ steps.release.outputs.pr }}
        # GitHub reads env before if, so the PR's JSON is parsed here: fromJSON would fail on
        # the empty output of a run that left the release PR alone.
        env:
          PR: ${{ steps.release.outputs.pr }}
          PREVIOUS: ${{ steps.before.outputs.head }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          git fetch --tags origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          node scripts/release-notes.ts "$PREVIOUS"
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam 'docs: draft the release notes' -m 'Docs: none'
          git push origin "HEAD:$BRANCH"

  # Each release's Lighthouse image, built from the released commit (docs/lighthouse.md).
  lighthouse-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/lighthouse-image.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      version: ${{ needs.release-please.outputs.tag_name }}
