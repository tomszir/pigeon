[tools]
node = "24"
pnpm = "12.15.0"
lefthook = "2.2.2"
# Rust, and the tools that build packages/crypto-wasm to WebAssembly. wasm-pack uses the
# wasm-bindgen on the PATH when its version matches the crate's, so nothing is fetched at build time.
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
"aqua:drager/wasm-pack" = "0.15.1"
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"

[tasks.setup]
description = "One-time setup after cloning (safe to re-run)"
run = ["pnpm install", "lefthook install", "node scripts/css-module-types.mjs apps/web/src"]

[tasks.dev]
description = "Run the web app on Vite's dev server"
run = "pnpm --filter web dev"

[tasks.lighthouse]
description = "Run a Lighthouse on this computer, from apps/lighthouse/lighthouse.json"
run = "pnpm --filter lighthouse start"

[tasks.build]
description = "Build the static site, and the WebAssembly it loads, into apps/web/dist"
run = "pnpm --filter web build"

[tasks."fonts:vendor"]
description = "Re-vendor the pinned fonts in vendor/fonts.lock.json into apps/web/src/fonts"
run = "node scripts/vendor.mjs vendor/fonts.lock.json apps/web/src/fonts"

[tasks."icons:vendor"]
description = "Re-vendor the pinned icons in vendor/icons.lock.json into apps/web/src/icons"
run = "node scripts/vendor.mjs vendor/icons.lock.json apps/web/src/icons"

[tasks."wallpapers:vendor"]
description = "Re-vendor the pinned wallpapers in vendor/wallpapers.lock.json into apps/web/src/wallpapers"
run = "node scripts/vendor.mjs vendor/wallpapers.lock.json apps/web/src/wallpapers"

[tasks."wycheproof:vendor"]
description = "Re-vendor the pinned Wycheproof test vectors in vendor/wycheproof.lock.json into packages/core/src/testing/wycheproof"
run = "node scripts/vendor.mjs vendor/wycheproof.lock.json packages/core/src/testing/wycheproof"

[tasks.defects]
description = "Plant each defect in verification/defects/ and check a test catches it (needs those files committed)"
run = "node scripts/check-defects.ts"

[tasks.fmt]
description = "Format and fix everything Biome can"
run = "pnpm biome check --write ."

[tasks.test]
description = "Unit tests in every package"
run = "pnpm -r test"

[tasks.check]
description = "The gate: lint (Biome, rustfmt, Clippy), types, unit tests (Vitest, cargo test), script tests (what CI runs)"
run = [
  "pnpm biome check .",
  "pnpm --filter @pigeon/crypto-wasm lint",
  "pnpm -r typecheck",
  "pnpm -r test",
  "node --test scripts/*.test.ts",
]

[tasks.e2e]
description = "Playwright end-to-end tests in real browsers over the public relays (needs internet)"
run = "pnpm --filter web e2e"

[tasks.deploy]
description = "Build and deploy to pigeon.tomszir.com (the maintainer runs this, never an agent)"
run = "pnpm --filter web deploy"

[tasks.share-card]
description = "Render assets/brand/share-card.html into apps/web/public/share-card.png, the link preview picture"
run = "pnpm --filter web exec node share-card.ts"
