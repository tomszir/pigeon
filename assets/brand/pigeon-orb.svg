      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="0.35" stop-color="#5cb4f5"/>
      <stop offset="0.75" stop-color="#1f6fd9"/>
      <stop offset="1" stop-color="#0b3c9e"/>
