<!-- Pigeon Messenger's icon at 48px: a white speech balloon with a rock pigeon in it, drawn like the avatars, and a green one
     answering behind. Drawn the XP way (lit from the upper left, darker outline, soft shadow
     down and to the right); render with `rsvg-convert -w 48 -h 48`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="white" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcf2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9be27a"/>
      <stop offset="1" stop-color="#3f9a22"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5fb4f6"/>
      <stop offset="1" stop-color="#1450c0"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a3b4dc"/>
      <stop offset="1" stop-color="#6479ad"/>
    </linearGradient>
    <radialGradient id="head" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b6c5e8"/>
      <stop offset="1" stop-color="#7488bb"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fbf8a"/>
      <stop offset="1" stop-color="#9a6cc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.000"/>
      <feOffset dx="2.000" dy="2.000"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
  <path d="M20 3.5 H38 Q43.5 3.5 43.5 9 V15 Q43.5 20.5 38 20.5 H41.5 L43 26 L35 20.5 H20 Q14.5 20.5 14.5 15 V9 Q14.5 3.5 20 3.5 Z" fill="url(#green)" stroke="#2a6e15" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M20.5 5.5 H37.5" stroke="#d6f5c4" stroke-width="1.0" stroke-linecap="round" opacity="0.8"/>
  <path d="M10 11.5 H28 Q35.5 11.5 35.5 19 V28 Q35.5 35.5 28 35.5 H17.5 L6 43.5 L9.5 35.5 Q2.5 35 2.5 28 V19 Q2.5 11.5 10 11.5 Z" fill="url(#white)" stroke="#2f4f96" stroke-width="1.0" stroke-linejoin="round"/>
  <clipPath id="inside"><path d="M10 12 H28 Q35 12 35 19 V28 Q35 35 28 35 H17.3 L7 42.3 L10.2 35 Q3 34.5 3 28 V19 Q3 12 10 12 Z"/></clipPath>
  <g clip-path="url(#inside)">
  <g transform="translate(0 2.6)" stroke="#2e3e66" stroke-width="1.000" stroke-linejoin="round">
    <path d="M17 22 C 17 26, 14 28.5, 11 31 C 8.5 33.5, 6.5 37, 4.5 44 H31 C 31.5 33, 30 29.5, 27.5 27 C 26 25.5, 26 24, 26.5 22.5 Z" fill="url(#plumage)"/>
    <path d="M18.5 23.5 C 20 25.5, 24 26.5, 27 26.6 C 27.6 28, 27.8 29, 27.6 30 C 24 30, 20.5 28.5, 18 26.5 Z" fill="url(#neck)" stroke="none"/>
    <path d="M4.5 44 C 6.5 34, 11.5 28.5, 17 28 C 20.5 29.5, 22 33, 21.5 44 Z" fill="#6a7eb0"/>
    <path d="M10.5 33 C 13 31.5, 16 31.3, 18.8 32.2 M9.6 35.4 C 12.5 34, 16 33.8, 19.5 34.8" fill="none" stroke="#2e3e66" stroke-width="1.200" stroke-linecap="round"/>
    <circle cx="22.5" cy="18.5" r="5.6" fill="url(#head)"/>
    <path d="M27.4 18.3 L 31.4 19.6 L 27.6 20.8 Z" fill="#4a3f3a" stroke="#2c2522"/>
    <path d="M27 17.4 Q 28.2 16.9 28.8 18" fill="none" stroke="#efe7dc" stroke-width="1.000" stroke-linecap="round"/>
    <circle cx="24.2" cy="17.4" r="1.40" fill="#f08a24" stroke="#2e3e66" stroke-width="0.800"/>
    <circle cx="24.4" cy="17.4" r="0.60" fill="#141414" stroke="none"/>
  </g>
  </g>
  <path d="M10 11.5 H28 Q35.5 11.5 35.5 19 V28 Q35.5 35.5 28 35.5 H17.5 L6 43.5 L9.5 35.5 Q2.5 35 2.5 28 V19 Q2.5 11.5 10 11.5 Z" fill="none" stroke="#2f4f96" stroke-width="1.0" stroke-linejoin="round"/>
